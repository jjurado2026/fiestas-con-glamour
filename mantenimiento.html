<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Propuesta no disponible | Fiestas con Glamour</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F2731">
<link rel="preload" href="assets/fonts/yeseva-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230F2731'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='19' fill='%23C2DCE0'>G</text></svg>">
<style>
/* =====================================================================
   Mantenimiento: lo que ve quien abre la propuesta pasados 10 días
   (index.html redirige aquí). La misma noche de estreno que la home,
   con la home entera en pequeño, recorriéndose sola en su marco.
   Movimiento: solo transform y opacity.
   ===================================================================== */
@font-face{font-family:'Yeseva One';src:url('assets/fonts/yeseva-one.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Jost';src:url('assets/fonts/jost.woff2') format('woff2');font-weight:300 700;font-display:swap}

:root{
  --brillo:#D9F6F7;--hielo:#C2DCE0;--azul:#8CA9AE;
  --noche:#0F2731;--noche-3:#0A1D25;
  --metal:linear-gradient(180deg,#F6FEFF 0%,#D9F6F7 30%,#9FC0C6 54%,#C2DCE0 74%,#EEFBFC 100%);
  --ease:cubic-bezier(.16,1,.3,1);
  --muelle:cubic-bezier(.34,1.56,.64,1);
  --margen:clamp(16px,4.5vw,56px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--noche)}
body{
  position:relative;isolation:isolate;margin:0;
  min-height:100vh;min-height:100svh;display:grid;place-items:center;
  padding:clamp(28px,6vh,72px) var(--margen);
  font-family:'Jost',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--hielo);
  background:
    radial-gradient(110% 70% at 50% -14%,rgba(72,134,151,.55) 0%,transparent 62%),
    radial-gradient(70% 46% at 50% 110%,rgba(46,98,114,.6) 0%,transparent 70%),
    linear-gradient(180deg,#0F2731 0%,#0C222B 100%);
  -webkit-font-smoothing:antialiased;
}

/* Focos de la home, barriendo despacio */
.focos{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;opacity:.8}
.foco{
  position:absolute;top:-6%;width:64vmax;height:125%;
  background:conic-gradient(at 50% 0%,transparent 0deg 166deg,rgba(194,220,224,.08) 172deg,rgba(217,246,247,.2) 180deg,rgba(194,220,224,.08) 188deg,transparent 194deg 360deg);
  transform-origin:50% 0;mix-blend-mode:screen;
}
.foco--izq{left:calc(12% - 32vmax);animation:barrerIzq 11s ease-in-out infinite alternate}
.foco--der{left:calc(88% - 32vmax);animation:barrerDer 13s ease-in-out infinite alternate}
@keyframes barrerIzq{from{transform:rotate(-34deg)}to{transform:rotate(-6deg)}}
@keyframes barrerDer{from{transform:rotate(32deg)}to{transform:rotate(5deg)}}

/* Texto a la izquierda, la home a la derecha (en móvil, debajo) */
.aviso{width:min(100%,36rem);display:grid;align-items:center;gap:clamp(30px,6vw,96px)}
@media (min-width:900px){.aviso{width:min(100%,1080px);grid-template-columns:minmax(0,36rem) auto;justify-content:center}}
.aviso__texto{max-width:36rem}
h1{
  margin:0;font-family:'Yeseva One',Georgia,serif;font-weight:400;
  font-size:clamp(27px,2.2vw + 14px,46px);line-height:1.16;letter-spacing:.005em;
  color:var(--brillo);text-wrap:balance;
}
p{margin:clamp(18px,2.6vh,28px) 0 0;max-width:34ch;font-size:clamp(17px,.45vw + 12px,20px);line-height:1.7;text-wrap:pretty}
a{
  border-radius:4px;color:var(--brillo);font-weight:500;overflow-wrap:anywhere;
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.24em;text-decoration-color:rgba(217,246,247,.45);
}
@media (hover:hover){a:hover{text-decoration-color:var(--brillo);text-decoration-thickness:2px}}
a:focus-visible{outline:3px solid var(--hielo);outline-offset:3px}
a:active{opacity:.7}

/* La home en pequeño: marco con el bisel plateado del logo */
.mini{
  --w:min(calc(100vw - 2 * var(--margen)),400px);--h:calc(var(--w) * .92);
  width:var(--w);margin:0;padding:1.5px;border-radius:18px;background:var(--metal);
  box-shadow:0 2px 6px rgba(10,29,37,.5),0 40px 90px -36px rgba(140,169,174,.6);
}
@media (min-width:900px){.mini{--w:clamp(250px,23vw,330px);--h:calc(var(--w) * 1.3)}}
.mini__marco{position:relative;overflow:hidden;border-radius:16.5px;background:var(--noche-3)}
.mini__marco::after{content:'';position:absolute;inset:auto 0 0;height:22%;background:linear-gradient(180deg,transparent,rgba(10,29,37,.3));pointer-events:none}
.mini__barra{display:flex;align-items:center;justify-content:center;height:32px;padding:0 12px;border-bottom:1px solid rgba(194,220,224,.12)}
.mini__dominio{padding:3px 12px;border-radius:999px;background:rgba(194,220,224,.08);font-size:11.5px;letter-spacing:.02em;color:var(--azul)}
.mini__pantalla{height:var(--h);overflow:hidden;overscroll-behavior:contain;scrollbar-width:none}
.mini__pantalla::-webkit-scrollbar{display:none}
.mini__pantalla:focus-visible{outline:3px solid var(--hielo);outline-offset:-3px;border-radius:0 0 16.5px 16.5px}
.mini__home{display:block;width:100%;height:auto;animation:recorrer 36s cubic-bezier(.45,.05,.55,.95) 2.4s infinite alternate both}
@keyframes recorrer{0%,7%{transform:translateY(0)}93%,100%{transform:translateY(calc(var(--h) - 100%))}}
@media (hover:hover){.mini__pantalla:hover .mini__home{animation-play-state:paused}}
/* Si la tocan, la rueda o el teclado, se recorre a mano */
.mini__pantalla.a-mano{overflow-y:auto}
.a-mano .mini__home{animation:none}

/* Entrada: el aviso y, detrás, la home que sube */
.aparece{animation:entra 1s var(--ease) var(--d,0s) both}
.mini{animation:subeMini 1.4s var(--muelle) .45s both}
@keyframes entra{from{opacity:0;transform:translateY(18px)}}
@keyframes subeMini{from{opacity:0;transform:translateY(56px) rotate(-4deg) scale(.92)}}

@media (prefers-reduced-motion:reduce){
  .foco,.aparece,.mini,.mini__home{animation:none}
  .mini__pantalla{overflow-y:auto}
}
</style>
</head>
<body>
<div class="focos" aria-hidden="true"><i class="foco foco--izq"></i><i class="foco foco--der"></i></div>

<main class="aviso">
  <div class="aviso__texto">
    <h1 class="aparece">No puedes ver esta página porque han pasado más de 10&nbsp;días desde su envío.</h1>
    <p class="aparece" style="--d:.18s">Si sigues con interés, escríbeme a <a href="mailto:jjuradogarciadelrio@gmail.com?subject=Propuesta%20web%20de%20Fiestas%20con%20Glamour">jjuradogarciadelrio@gmail.com</a>.</p>
  </div>

  <figure class="mini">
    <div class="mini__marco">
      <div class="mini__barra" aria-hidden="true"><span class="mini__dominio">fiestasconglamour.com</span></div>
      <div class="mini__pantalla" tabindex="0" role="region" aria-label="Miniatura de la home">
        <img class="mini__home" src="assets/img/home-miniatura.webp" width="720" height="4347" alt="La home completa propuesta para Fiestas con Glamour" decoding="async">
      </div>
    </div>
  </figure>
</main>

<script>
/* La miniatura se recorre sola; al tocarla, con la rueda o con el teclado
   pasa a recorrerse a mano desde donde iba. */
(function () {
  var pantalla = document.querySelector('.mini__pantalla'), home = pantalla.querySelector('img');
  function aMano() {
    if (pantalla.classList.contains('a-mano')) return;
    var t = getComputedStyle(home).transform, y = 0;
    try { if (t && t !== 'none') y = new DOMMatrixReadOnly(t).m42; } catch (e) {}
    pantalla.classList.add('a-mano');
    pantalla.scrollTop = -y;
  }
  ['wheel', 'touchstart', 'pointerdown', 'focus', 'keydown'].forEach(function (tipo) {
    pantalla.addEventListener(tipo, aMano, { passive: true });
  });
})();
</script>
</body>
</html>
